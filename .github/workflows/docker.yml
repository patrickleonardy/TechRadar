name: Publish TechRadar containers

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/docker.yml'
      - 'docker/**'
      - 'trendradar/**'
      - 'scripts/**'
      - 'config/**'
      - 'deploy/zima/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: collector
            dockerfile: docker/Dockerfile
          - component: codex
            dockerfile: docker/Dockerfile.codex
    steps:
      - uses: actions/checkout@v6
      - name: Build and check image
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -eu
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg TARGETARCH=amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f "$DOCKERFILE" \
            -t "$IMAGE:$COMPONENT-$GITHUB_SHA" -t "$IMAGE:$COMPONENT" .
          if [ "$COMPONENT" = collector ]; then
            docker run --rm --entrypoint python "$IMAGE:$COMPONENT-$GITHUB_SHA" \
              -c 'import importlib.util; assert importlib.util.find_spec("litellm") is None; from trendradar.ai.client import AIClient; print("HTTP client loads; LiteLLM absent")'
          else
            docker run --rm --entrypoint codex "$IMAGE:$COMPONENT-$GITHUB_SHA" --version
            docker run --rm "$IMAGE:$COMPONENT-$GITHUB_SHA" --help
          fi
      - name: Publish to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -eu
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$COMPONENT-$GITHUB_SHA"
          docker push "$IMAGE:$COMPONENT"
